<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Attendance System</title>

    <link rel="stylesheet" href="style.css">

    <!-- Face API -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>

        /* ================= MENU ================= */

        .menu-container {
            position: relative;
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }

        .menu-button {
            width: 70px;
            height: 55px;
            font-size: 28px;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        .main-menu {
            display: none;
            position: absolute;
            top: 65px;
            z-index: 1000;
            width: 300px;
            background: white;
            padding: 12px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.20);
        }

        .main-menu.show {
            display: block;
        }

        .main-menu button {
            width: 100%;
            margin: 5px 0;
            text-align: left;
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .main-menu button:hover {
            opacity: 0.88;
        }

        /* ================= MODAL ================= */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 500px;
            max-height: 85vh;
            overflow-y: auto;
            background: white;
            padding: 25px;
            border-radius: 18px;
            position: relative;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
        }

        .modal-content h2 {
            margin-bottom: 20px;
        }

        .modal-content input {
            width: 100%;
            margin-bottom: 12px;
        }

        .close-modal {
            position: absolute;
            right: 15px;
            top: 15px;
            width: 40px;
            height: 40px;
            padding: 0;
            background: #dc3545;
            border-radius: 50%;
        }

        .admin-info {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 18px;
            border-radius: 12px;
            line-height: 1.8;
        }

        .registered-student {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
        }

    </style>

</head>


<body>


<div class="container">


    <!-- ================= HEADER ================= -->

    <header>

        <!-- THREE HORIZONTAL BAR -->

        <div class="menu-container">

            <button
                type="button"
                class="menu-button"
                onclick="toggleMenu()"
            >
                ☰
            </button>


            <!-- EVERYTHING INSIDE THREE BAR -->

            <div
                id="mainMenu"
                class="main-menu"
            >

                <button
                    type="button"
                    onclick="openEditDetails()"
                >
                    ✏️ Edit My Details
                </button>


                <button
                    type="button"
                    onclick="openMobileUpdate()"
                >
                    📱 Add / Update Mobile
                </button>


                <button
                    type="button"
                    onclick="showRegisteredStudents()"
                >
                    👥 Registered Students
                </button>


                <!-- ADMIN LAST -->

                <button
                    type="button"
                    onclick="showAdminDetails()"
                >
                    👑 Admin: Ayush
                </button>

            </div>

        </div>


        <h1>Smart Attendance System</h1>

        <p>Student Attendance Dashboard</p>

    </header>



    <!-- ================= DASHBOARD ================= -->

    <section class="dashboard">

        <div class="card">
            <h3>Total Students</h3>
            <h2 id="totalStudents">0</
