<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Attendance System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Smart Attendance System</h1>
            <p>Student Attendance Dashboard</p>
        </header>

        <!-- Dashboard Cards -->

        <section class="dashboard">

            <div class="card">
                <h3>Total Students</h3>
                <h2 id="totalStudents">0</h2>
            </div>

            <div class="card">
                <h3>Present</h3>
                <h2 id="presentStudents">0</h2>
            </div>

            <div class="card">
                <h3>Absent</h3>
                <h2 id="absentStudents">0</h2>
            </div>

            <div class="card">
                <h3>Attendance</h3>
                <h2 id="attendancePercentage">0%</h2>
            </div>

        </section>


        <!-- Add Student -->

        <section class="box">

            <h2>Add Student</h2>

            <div class="form">

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter student name"
                >

                <input
                    type="text"
                    id="studentRoll"
                    placeholder="Enter roll number"
                >

                <button onclick="addStudent()">
                    Add Student
                </button>

            </div>

        </section>


        <!-- Search -->

        <section class="box">

            <h2>Search Student</h2>

            <input
                class="search"
                type="text"
                id="searchStudent"
                placeholder="Search by name or roll number"
                oninput="displayStudents()"
            >

        </section>


        <!-- Attendance -->

        <section class="box">

            <h2>Today's Attendance</h2>

            <div id="studentList"></div>

        </section>
<section class="box face-section">

    <h2>Face Attendance</h2>

    <video id="camera" autoplay playsinline></video>

    <p id="faceMessage">
        
    </p>

    <button onclick="startCamera()">
        Start Camera
    </button>

</section>
    </div>


    <script src="script.js"></script>
<script src="script.js"></script>
</body>
</html>
